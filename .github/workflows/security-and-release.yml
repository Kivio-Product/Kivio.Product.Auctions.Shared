name: Security Scan & Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ecommerce-client repository
        run: |
          git clone https://github.com/Kivio-Product/Kivio.Product.Auctions.EcommerceClient.git ecommerce-client

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.11'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...


  auto-version:
    name: Auto Versioning & Release
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Obtener el tag más reciente
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Determine version bump type
        id: bump_type
        run: |
          # Obtener commits desde el último tag
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          COMMITS=$(git log $LATEST_TAG..HEAD --oneline)

          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"

          # Determinar tipo de bump basado en mensajes de commit
          # Convención:
          # - BREAKING CHANGE o feat!: -> major
          # - feat: -> minor
          # - fix:, chore:, docs:, etc. -> patch

          BUMP_TYPE="patch"  # default

          if echo "$COMMITS" | grep -qiE "BREAKING CHANGE|feat!:|^[a-z]+!:"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "^feat:"; then
            BUMP_TYPE="minor"
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Bump type determined: $BUMP_TYPE"

      - name: Calculate new version
        id: new_version
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.bump_type }}"

          # Remover 'v' prefix si existe
          VERSION=${LATEST_TAG#v}

          # Split version into components
          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          # Bump version based on type
          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag $NEW_VERSION already exists"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag $NEW_VERSION does not exist"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.bump_type }}"

          # Configurar git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Crear tag anotado con mensaje
          git tag -a "$NEW_VERSION" -m "Auto-release $NEW_VERSION ($BUMP_TYPE bump)

          Security scan passed with govulncheck.

          Generated by GitHub Actions"

          # Push tag
          git push origin "$NEW_VERSION"

          echo "Created and pushed tag: $NEW_VERSION"

      - name: Generate release notes
        if: steps.check_tag.outputs.tag_exists == 'false'
        id: release_notes
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.bump_type }}"

          # Generar notas de release
          cat > release_notes.md << EOF
          ## $NEW_VERSION

          **Type:** $BUMP_TYPE version bump
          **Security:** ✅ No vulnerabilities detected by govulncheck

          ### Changes since $LATEST_TAG

          EOF

          # Agregar commits
          git log $LATEST_TAG..HEAD --pretty=format:"- %s (%h)" >> release_notes.md

          cat >> release_notes.md << EOF


          ### Security Status
          - ✅ Vulnerability scan passed
          - ✅ All dependencies verified
          - ✅ Build successful
          - ✅ Tests passed

          ---
          *This release was automatically generated by GitHub Actions*
          EOF

          cat release_notes.md
